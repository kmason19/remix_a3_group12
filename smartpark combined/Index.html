<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartPark</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <nav>
        <img src="logo.png" class="logo">
        <div>
            <a href="index.html">Home</a>
            <a href="booking.html">Bookings</a>
            <a href="provider.html">Provider</a>
        </div>
    </nav>

    <header>
        <h1>SmartPark</h1>
        <p>Book hotel parking spaces securely using blockchain smart contracts</p>
        <p id="walletAddress">Wallet not connected</p>
        <button id="connectWalletBtn">Connect Wallet</button>
    </header>

    <main>
        
        <section class="section-title">
            <h2>Available Parking Spaces</h2>
            <p>Select an available parking space and create a booking.</p>
        </section>

        <section class="parking-grid" id="parkingSpacesList">

        </section>

        <section class="card status-box">
            <h2>Transaction Status</h2>
            <p id="homestatus">No transaction submitted yet.</p>
        </section>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script>
//store conection to blockchain netwotrk 
let provider;
//store the current;u connected wallet account
let signer;
//store wallet address as text
let userAddress;


//Waits until webpage loads  
window.addEventListener("load", async function () {

    //Checks metamask is installed 
    if (!window.ethereum) {

        //Message displaying metamask cannot be found
        document.getElementById("walletAddress").textContent =
            "MetaMask not installed";

        //stop code from running
        return;
    }

    try {
        //create connection between ether.js and metamask
        provider = new ethers.providers.Web3Provider(window.ethereum);

        //request permission from metamask to access user's wallet
        await provider.send("eth_requestAccounts", []);

        //get wallet account selected in metamask
        signer = provider.getSigner();
        //retreive wallet address
        userAddress = await signer.getAddress();

        //displays wallet address on webpage (shortended version)
        document.getElementById("walletAddress").textContent =
            "Connected: " +
            userAddress.substring(0, 6) +
            "..." +
            userAddress.substring(userAddress.length - 4);

        //print full wallet address to browser console
        console.log("Connected wallet:", userAddress);


    //catches errors during connection
    } catch (error) {
        //prints error
        console.log("Wallet connection failed:", error);
    }
});
</script>
</body>

</html>
